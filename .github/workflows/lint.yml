name: Lint

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main]

jobs:
  lint:
    name: ESLint (Kew design system rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # ESLint exits 0 for warnings, 1 for errors.
      # Tier 1 rules are "error" → PR fails. Tier 2 are "warn" → informational only.
      - name: Run ESLint
        run: npm run lint
